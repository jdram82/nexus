<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#fefce8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#713f12"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" fill="#fef3c7" font-weight="bold">CONSULTING</text>
  
  <!-- Hero Split -->
  <rect x="0" y="80" width="600" height="400" fill="#fef3c7"/>
  <text x="300" y="230" font-family="Arial, sans-serif" font-size="42" fill="#713f12" font-weight="bold" text-anchor="middle">Expert</text>
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="42" fill="#713f12" font-weight="bold" text-anchor="middle">Consulting</text>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="16" fill="#92400e" text-anchor="middle">Strategic solutions for your business</text>
  
  <rect x="600" y="80" width="600" height="400" fill="#f59e0b" opacity="0.2"/>
  <circle cx="900" cy="280" r="80" fill="#f59e0b" opacity="0.3"/>
  <text x="900" y="295" font-family="Arial, sans-serif" font-size="48" fill="#92400e" text-anchor="middle">📈</text>
  
  <!-- Services -->
  <rect x="150" y="550" width="250" height="200" fill="white" rx="8" stroke="#fde68a" stroke-width="2"/>
  <text x="275" y="610" font-family="Arial, sans-serif" font-size="20" fill="#713f12" font-weight="bold" text-anchor="middle">Strategy</text>
  <text x="275" y="650" font-family="Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle">Business planning</text>
  
  <rect x="475" y="550" width="250" height="200" fill="white" rx="8" stroke="#fde68a" stroke-width="2"/>
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="20" fill="#713f12" font-weight="bold" text-anchor="middle">Growth</text>
  <text x="600" y="650" font-family="Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle">Scale operations</text>
  
  <rect x="800" y="550" width="250" height="200" fill="white" rx="8" stroke="#fde68a" stroke-width="2"/>
  <text x="925" y="610" font-family="Arial, sans-serif" font-size="20" fill="#713f12" font-weight="bold" text-anchor="middle">Transform</text>
  <text x="925" y="650" font-family="Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle">Digital solutions</text>
  
  <!-- PRO Badge -->
  <rect x="1050" y="120" width="80" height="30" rx="15" fill="#f59e0b"/>
  <text x="1090" y="142" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">PRO</text>
</svg>
