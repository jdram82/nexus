<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#fdf2f8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#831843"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" fill="#fce7f3" font-weight="bold" style="letter-spacing: 3px;">FASHION</text>
  <text x="950" y="50" font-family="Arial, sans-serif" font-size="14" fill="#fce7f3">NEW</text>
  <text x="1020" y="50" font-family="Arial, sans-serif" font-size="14" fill="#fce7f3">SALE</text>
  <text x="1090" y="50" font-family="Arial, sans-serif" font-size="14" fill="#fce7f3">CART</text>
  
  <!-- Hero -->
  <rect x="0" y="80" width="600" height="450" fill="#f9a8d4" opacity="0.3"/>
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="56" fill="#831843" font-weight="bold" text-anchor="middle">NEW</text>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="56" fill="#831843" font-weight="bold" text-anchor="middle">COLLECTION</text>
  <rect x="200" y="360" width="200" height="50" rx="0" fill="#831843"/>
  <text x="300" y="392" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" style="letter-spacing: 2px;">SHOP NOW</text>
  
  <rect x="600" y="80" width="600" height="450" fill="#ec4899" opacity="0.2"/>
  
  <!-- Product Showcase -->
  <rect x="150" y="600" width="280" height="200" fill="white" rx="0" stroke="#f9a8d4" stroke-width="1"/>
  <text x="290" y="660" font-family="Arial, sans-serif" font-size="16" fill="#831843" text-anchor="middle">Summer Dress</text>
  <text x="290" y="700" font-family="Arial, sans-serif" font-size="28" fill="#ec4899" font-weight="bold" text-anchor="middle">$129</text>
  
  <rect x="480" y="600" width="280" height="200" fill="white" rx="0" stroke="#f9a8d4" stroke-width="1"/>
  <text x="620" y="660" font-family="Arial, sans-serif" font-size="16" fill="#831843" text-anchor="middle">Elegant Bag</text>
  <text x="620" y="700" font-family="Arial, sans-serif" font-size="28" fill="#ec4899" font-weight="bold" text-anchor="middle">$89</text>
  
  <rect x="810" y="600" width="280" height="200" fill="white" rx="0" stroke="#f9a8d4" stroke-width="1"/>
  <text x="950" y="660" font-family="Arial, sans-serif" font-size="16" fill="#831843" text-anchor="middle">Designer Shoes</text>
  <text x="950" y="700" font-family="Arial, sans-serif" font-size="28" fill="#ec4899" font-weight="bold" text-anchor="middle">$159</text>
  
  <!-- PRO Badge -->
  <rect x="1050" y="120" width="80" height="30" rx="15" fill="#ec4899"/>
  <text x="1090" y="142" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">PRO</text>
</svg>
