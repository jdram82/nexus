<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#18181b"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#27272a"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" fill="#fafafa" font-weight="300">PHOTOGRAPHER</text>
  <text x="1000" y="50" font-family="Arial, sans-serif" font-size="14" fill="#a1a1aa">PORTFOLIO</text>
  <text x="1110" y="50" font-family="Arial, sans-serif" font-size="14" fill="#a1a1aa">CONTACT</text>
  
  <!-- Hero -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" fill="#fafafa" font-weight="300" text-anchor="middle">John Smith</text>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="20" fill="#71717a" text-anchor="middle">VISUAL STORYTELLER</text>
  
  <!-- Photo Grid -->
  <rect x="80" y="330" width="350" height="250" fill="#3f3f46" rx="4"/>
  <text x="255" y="445" font-family="Arial, sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Landscape</text>
  
  <rect x="460" y="330" width="350" height="250" fill="#3f3f46" rx="4"/>
  <text x="635" y="445" font-family="Arial, sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Portrait</text>
  
  <rect x="840" y="330" width="280" height="250" fill="#3f3f46" rx="4"/>
  <text x="980" y="445" font-family="Arial, sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Street</text>
  
  <rect x="80" y="610" width="280" height="200" fill="#3f3f46" rx="4"/>
  <text x="220" y="700" font-family="Arial, sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Nature</text>
  
  <rect x="390" y="610" width="350" height="200" fill="#3f3f46" rx="4"/>
  <text x="565" y="700" font-family="Arial, sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Architecture</text>
  
  <rect x="770" y="610" width="350" height="200" fill="#3f3f46" rx="4"/>
  <text x="945" y="700" font-family="Arial, sans-serif" font-size="14" fill="#71717a" text-anchor="middle">Events</text>
  
  <!-- PRO Badge -->
  <rect x="1050" y="120" width="80" height="30" rx="15" fill="#71717a"/>
  <text x="1090" y="142" font-family="Arial, sans-serif" font-size="14" fill="#fafafa" text-anchor="middle">PRO</text>
</svg>
