<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#1e293b"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">CORPORATE</text>
  <rect x="950" y="30" width="80" height="20" rx="4" fill="white" opacity="0.2"/>
  <rect x="1050" y="30" width="80" height="20" rx="4" fill="#3b82f6"/>
  
  <!-- Hero Section -->
  <rect x="100" y="150" width="500" height="300" fill="#e2e8f0" rx="8"/>
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Hero Image</text>
  
  <text x="700" y="220" font-family="Arial, sans-serif" font-size="36" fill="#1e293b" font-weight="bold">Professional</text>
  <text x="700" y="270" font-family="Arial, sans-serif" font-size="36" fill="#1e293b" font-weight="bold">Business Solutions</text>
  <text x="700" y="330" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Transform your enterprise with cutting-edge</text>
  <text x="700" y="360" font-family="Arial, sans-serif" font-size="16" fill="#64748b">technology and innovative strategies</text>
  
  <rect x="700" y="400" width="140" height="45" rx="6" fill="#3b82f6"/>
  <text x="770" y="430" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Get Started</text>
  
  <!-- Features Section -->
  <rect x="100" y="550" width="300" height="250" fill="white" rx="8" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="250" cy="620" r="30" fill="#dbeafe"/>
  <text x="250" y="630" font-family="Arial, sans-serif" font-size="24" fill="#3b82f6" text-anchor="middle">📊</text>
  <text x="250" y="690" font-family="Arial, sans-serif" font-size="18" fill="#1e293b" font-weight="bold" text-anchor="middle">Analytics</text>
  <text x="250" y="730" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Data-driven insights</text>
  
  <rect x="450" y="550" width="300" height="250" fill="white" rx="8" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="600" cy="620" r="30" fill="#dbeafe"/>
  <text x="600" y="630" font-family="Arial, sans-serif" font-size="24" fill="#3b82f6" text-anchor="middle">🚀</text>
  <text x="600" y="690" font-family="Arial, sans-serif" font-size="18" fill="#1e293b" font-weight="bold" text-anchor="middle">Growth</text>
  <text x="600" y="730" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Scale your business</text>
  
  <rect x="800" y="550" width="300" height="250" fill="white" rx="8" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="950" cy="620" r="30" fill="#dbeafe"/>
  <text x="950" y="630" font-family="Arial, sans-serif" font-size="24" fill="#3b82f6" text-anchor="middle">🔒</text>
  <text x="950" y="690" font-family="Arial, sans-serif" font-size="18" fill="#1e293b" font-weight="bold" text-anchor="middle">Security</text>
  <text x="950" y="730" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Enterprise-grade protection</text>
</svg>
