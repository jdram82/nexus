<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="900" fill="#0f172a"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#1e293b"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">AGENCY</text>
  <rect x="1050" y="25" width="100" height="30" rx="6" fill="url(#grad1)"/>
  <text x="1100" y="48" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Contact</text>
  
  <!-- Hero -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="56" fill="white" font-weight="bold" text-anchor="middle">Creative Agency</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Building brands that inspire</text>
  
  <rect x="475" y="360" width="250" height="55" rx="8" fill="url(#grad1)"/>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">View Our Work</text>
  
  <!-- Portfolio Grid -->
  <rect x="100" y="500" width="330" height="250" fill="#1e293b" rx="8"/>
  <text x="265" y="615" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Project 1</text>
  
  <rect x="470" y="500" width="330" height="250" fill="#1e293b" rx="8"/>
  <text x="635" y="615" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Project 2</text>
  
  <rect x="840" y="500" width="330" height="250" fill="#1e293b" rx="8"/>
  <text x="1005" y="615" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Project 3</text>
  
  <!-- Badge -->
  <circle cx="1120" cy="160" r="40" fill="#8b5cf6" opacity="0.2"/>
  <text x="1120" y="170" font-family="Arial, sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle">PRO</text>
</svg>
