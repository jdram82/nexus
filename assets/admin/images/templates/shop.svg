<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#ecfdf5"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#064e3b"/>
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="24" fill="#d1fae5" font-weight="bold">ONLINE SHOP</text>
  <text x="1000" y="50" font-family="Arial, sans-serif" font-size="14" fill="#d1fae5">🛒 Cart (0)</text>
  
  <!-- Hero Banner -->
  <rect x="0" y="80" width="1200" height="200" fill="#10b981" opacity="0.2"/>
  <text x="600" y="150" font-family="Arial, sans-serif" font-size="42" fill="#064e3b" font-weight="bold" text-anchor="middle">Summer Sale</text>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="20" fill="#047857" text-anchor="middle">Up to 50% off on selected items</text>
  <rect x="520" y="210" width="160" height="45" rx="8" fill="#10b981"/>
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Shop Now</text>
  
  <!-- Product Grid -->
  <rect x="100" y="350" width="250" height="400" fill="white" rx="12" stroke="#d1fae5" stroke-width="2"/>
  <rect x="120" y="370" width="210" height="210" fill="#d1fae5" rx="8"/>
  <text x="225" y="485" font-family="Arial, sans-serif" font-size="16" fill="#047857" text-anchor="middle">Product Image</text>
  <text x="120" y="620" font-family="Arial, sans-serif" font-size="18" fill="#064e3b" font-weight="bold">Product Name</text>
  <text x="120" y="650" font-family="Arial, sans-serif" font-size="24" fill="#10b981" font-weight="bold">$49.99</text>
  <rect x="120" y="680" width="210" height="40" rx="6" fill="#10b981"/>
  <text x="225" y="706" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Add to Cart</text>
  
  <rect x="400" y="350" width="250" height="400" fill="white" rx="12" stroke="#d1fae5" stroke-width="2"/>
  <rect x="420" y="370" width="210" height="210" fill="#d1fae5" rx="8"/>
  <text x="525" y="620" font-family="Arial, sans-serif" font-size="18" fill="#064e3b" font-weight="bold">Product Name</text>
  <text x="420" y="650" font-family="Arial, sans-serif" font-size="24" fill="#10b981" font-weight="bold">$39.99</text>
  
  <rect x="700" y="350" width="250" height="400" fill="white" rx="12" stroke="#d1fae5" stroke-width="2"/>
  <rect x="720" y="370" width="210" height="210" fill="#d1fae5" rx="8"/>
  <text x="825" y="620" font-family="Arial, sans-serif" font-size="18" fill="#064e3b" font-weight="bold">Product Name</text>
  <text x="720" y="650" font-family="Arial, sans-serif" font-size="24" fill="#10b981" font-weight="bold">$59.99</text>
  
  <!-- PRO Badge -->
  <rect x="1050" y="120" width="80" height="30" rx="15" fill="#10b981"/>
  <text x="1090" y="142" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">PRO</text>
</svg>
